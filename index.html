<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pencatatan Pengerjaan Bubut</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
    body { font-family: 'Inter', sans-serif; }
  </style>
</head>
<body class="bg-slate-100 min-h-screen flex flex-col justify-between text-slate-800">

  <div>
    <header class="bg-indigo-600 text-white shadow-lg sticky top-0 z-50">
      <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
        <div class="flex items-center space-x-3">
          <i class="fa-solid fa-gears text-2xl text-amber-400 mr-2"></i>
          <h1 class="text-xl font-bold tracking-wide">Pencatatan Bengkel Bubut</h1>
        </div>
        <button onclick="loadData()" class="bg-indigo-700 hover:bg-indigo-800 text-white px-3 py-1.5 rounded-lg text-sm transition flex items-center gap-2">
          <i class="fa-solid fa-rotate" id="refresh-icon"></i> Refresh Data
        </button>
      </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 py-6 grid grid-cols-1 lg:grid-cols-3 gap-6">
      <section class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
        <h2 class="text-lg font-semibold mb-4 text-indigo-900 border-b pb-2 flex items-center gap-2">
          <i class="fa-solid fa-square-plus text-indigo-600"></i> Tambah SPK Baru
        </h2>
        
        <form id="spkForm" onsubmit="submitForm(event)" class="space-y-4">
          <div>
            <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">No SPK</label>
            <input type="text" id="noSpk" required class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none text-sm" placeholder="Contoh: SPK-001">
          </div>

          <div>
            <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Nama Customer</label>
            <input type="text" id="namaCostumer" required class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none text-sm" placeholder="Nama Pelanggan">
          </div>

          <div>
            <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Nama Barang</label>
            <input type="text" id="namaBarang" required class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none text-sm" placeholder="Nama Komponen / Sparepart">
          </div>

          <div>
            <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Detail Pengerjaan</label>
            <textarea id="pengerjaan" rows="2" required class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none text-sm" placeholder="Deskripsi perbaikan/pembuatan..."></textarea>
          </div>

          <div>
            <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Jumlah (QTY)</label>
            <div class="flex gap-2">
              <input type="number" id="jumlahAngka" min="1" required class="w-2/3 px-3 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none text-sm" placeholder="Jumlah">
              <select id="satuanQty" required class="w-1/3 px-3 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none text-sm bg-white font-semibold">
                <option value="PCS">PCS</option>
                <option value="UNIT">UNIT</option>
                <option value="SISI">SISI</option>
              </select>
            </div>
          </div>

          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Tgl Masuk</label>
              <input type="date" id="tanggalMasuk" required class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none text-sm">
            </div>
            <div>
              <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Tgl Keluar</label>
              <input type="date" id="tanggalKeluar" class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none text-sm">
            </div>
          </div>

          <div>
            <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Status Pengerjaan</label>
            <select id="status" required class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none text-sm bg-white">
              <option value="ANTRIAN">ANTRIAN</option>
              <option value="PROSES BUBUT/LAS">PROSES BUBUT/LAS</option>
              <option value="SELESAI">SELESAI</option>
              <option value="DIAMBIL">DIAMBIL</option>
            </select>
          </div>

          <button type="submit" id="btnSubmit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2.5 rounded-lg transition shadow-md flex justify-center items-center gap-2 text-sm">
            <i class="fa-solid fa-paper-plane"></i> Simpan Data
          </button>
        </form>
      </section>

      <section class="lg:col-span-2 bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
        <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 mb-4 border-b pb-3">
          <h2 class="text-lg font-semibold text-indigo-900 flex items-center gap-2">
            <i class="fa-solid fa-list-check text-indigo-600"></i> Daftar Pengerjaan
          </h2>
          <input type="text" id="searchInput" onkeyup="filterTable()" placeholder="Cari SPK / Customer / Barang..." class="px-3 py-1.5 border rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none w-full sm:w-64">
        </div>

        <div class="overflow-x-auto">
          <table class="w-full text-left border-collapse">
            <thead>
              <tr class="bg-slate-50 text-slate-500 text-xs font-bold uppercase tracking-wider border-b">
                <th class="p-3">SPK & Customer</th>
                <th class="p-3">Barang & Pengerjaan</th>
                <th class="p-3">QTY</th>
                <th class="p-3">Tanggal</th>
                <th class="p-3">Status</th>
              </tr>
            </thead>
            <tbody id="tableBody" class="divide-y divide-slate-100 text-sm">
              <tr>
                <td colspan="5" class="text-center py-8 text-slate-400">Memuat data...</td>
              </tr>
            </tbody>
          </table>
        </div>
      </section>
    </main>
  </div>

  <footer class="bg-slate-900 text-slate-400 py-4 text-center text-xs font-semibold tracking-widest uppercase border-t border-slate-800">
    DESAIN WEB BY : AMY
  </footer>

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzHCYUjUf84P4TFSVUV9ZjM4pVaCTyTyn7QcNLYOWfMVyWaPS0DRjo3pMpUft8oJjIjAA/exec";
    let globalData = [];

    document.addEventListener('DOMContentLoaded', () => {
      document.getElementById('tanggalMasuk').value = new Date().toISOString().split('T')[0];
      loadData();
    });

    function loadData() {
      const icon = document.getElementById('refresh-icon');
      if (icon) icon.classList.add('fa-spin');

      fetch(SCRIPT_URL)
        .then(res => res.json())
        .then(data => {
          globalData = data;
          renderTable(data);
          if (icon) icon.classList.remove('fa-spin');
        })
        .catch(err => {
          alert('Gagal memuat data: ' + err);
          if (icon) icon.classList.remove('fa-spin');
        });
    }

    function renderTable(data) {
      const tbody = document.getElementById('tableBody');
      if (!data || data.length === 0) {
        tbody.innerHTML = `<tr><td colspan="5" class="text-center py-8 text-slate-400">Belum ada data pengerjaan.</td></tr>`;
        return;
      }

      tbody.innerHTML = data.map(item => `
        <tr class="hover:bg-slate-50 transition">
          <td class="p-3 align-top">
            <span class="font-bold text-indigo-600 block">${item.noSpk}</span>
            <span class="text-slate-700 font-medium">${item.namaCostumer}</span>
          </td>
          <td class="p-3 align-top">
            <span class="font-semibold text-slate-800 block">${item.namaBarang}</span>
            <span class="text-xs text-slate-500 whitespace-pre-line">${item.pengerjaan}</span>
          </td>
          <td class="p-3 align-top font-semibold text-slate-700 whitespace-nowrap">
            <span class="bg-slate-100 border border-slate-200 px-2 py-0.5 rounded text-xs">${item.jumlahQty || '-'}</span>
          </td>
          <td class="p-3 align-top text-xs space-y-1 whitespace-nowrap">
            <div><b class="text-slate-400">Masuk:</b> ${item.tanggalMasuk || '-'}</div>
            <div><b class="text-slate-400">Keluar:</b> ${item.tanggalKeluar || '-'}</div>
          </td>
          <td class="p-3 align-top">
            <select onchange="changeStatus(${item.rowIndex}, this.value)" class="text-xs font-bold px-2 py-1 rounded-full border border-transparent transition cursor-pointer ${getStatusStyle(item.status)}">
              <option value="ANTRIAN" ${item.status === 'ANTRIAN' ? 'selected' : ''}>ANTRIAN</option>
              <option value="PROSES BUBUT/LAS" ${item.status === 'PROSES BUBUT/LAS' ? 'selected' : ''}>PROSES BUBUT/LAS</option>
              <option value="SELESAI" ${item.status === 'SELESAI' ? 'selected' : ''}>SELESAI</option>
              <option value="DIAMBIL" ${item.status === 'DIAMBIL' ? 'selected' : ''}>DIAMBIL</option>
            </select>
          </td>
        </tr>
      `).join('');
    }

    function getStatusStyle(status) {
      switch (status) {
        case 'ANTRIAN': return 'bg-amber-100 text-amber-800 border-amber-200';
        case 'PROSES BUBUT/LAS': return 'bg-blue-100 text-blue-800 border-blue-200';
        case 'SELESAI': return 'bg-emerald-100 text-emerald-800 border-emerald-200';
        case 'DIAMBIL': return 'bg-slate-200 text-slate-700 border-slate-300';
        default: return 'bg-slate-100 text-slate-600';
      }
    }

    function changeStatus(rowIndex, newStatus) {
      fetch(SCRIPT_URL, {
        method: 'POST',
        body: JSON.stringify({ action: 'updateStatus', rowIndex: rowIndex, newStatus: newStatus })
      })
      .then(() => loadData());
    }

    function submitForm(e) {
      e.preventDefault();
      const btn = document.getElementById('btnSubmit');
      btn.disabled = true;
      btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> Menyimpan...`;

      const payload = {
        action: 'add',
        noSpk: document.getElementById('noSpk').value,
        namaCostumer: document.getElementById('namaCostumer').value,
        namaBarang: document.getElementById('namaBarang').value,
        pengerjaan: document.getElementById('pengerjaan').value,
        jumlahAngka: document.getElementById('jumlahAngka').value,
        satuanQty: document.getElementById('satuanQty').value,
        tanggalMasuk: document.getElementById('tanggalMasuk').value,
        tanggalKeluar: document.getElementById('tanggalKeluar').value,
        status: document.getElementById('status').value
      };

      fetch(SCRIPT_URL, {
        method: 'POST',
        body: JSON.stringify(payload)
      })
      .then(() => {
        document.getElementById('spkForm').reset();
        document.getElementById('tanggalMasuk').value = new Date().toISOString().split('T')[0];
        btn.disabled = false;
        btn.innerHTML = `<i class="fa-solid fa-paper-plane"></i> Simpan Data`;
        loadData();
      });
    }

    function filterTable() {
      const query = document.getElementById('searchInput').value.toLowerCase();
      const filtered = globalData.filter(item => 
        item.noSpk.toString().toLowerCase().includes(query) ||
        item.namaCostumer.toLowerCase().includes(query) ||
        item.namaBarang.toLowerCase().includes(query)
      );
      renderTable(filtered);
    }
  </script>
</body>
</html>
